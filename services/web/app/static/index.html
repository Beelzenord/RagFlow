<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rahmqvist Assistant</title>
  <link rel="stylesheet" href="/styles.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("rag.theme.v1");
        document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
      } catch (_) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <a class="brand-logo" href="/" aria-label="Rahmqvist"></a>
      <h1>Rahmqvist Assistant</h1>
      <span class="hint hint-admin">Upload documents, watch them index, then ask questions.</span>
      <span class="hint hint-reader">How can we help? Just ask.</span>
    </div>
    <button
      type="button"
      id="theme-toggle"
      class="theme-toggle"
      role="switch"
      aria-checked="false"
      aria-label="Use light mode"
    >
      <span class="theme-toggle-track" aria-hidden="true">
        <span class="theme-toggle-thumb"></span>
      </span>
      <span class="theme-toggle-text">
        <span class="theme-label-dark">Dark</span>
        <span class="theme-label-light">Light</span>
      </span>
    </button>
    <span id="user-badge" class="user-badge" hidden></span>
    <button type="button" id="logout-btn" class="btn-secondary" hidden>Log out</button>
  </header>

  <main class="grid">
    <aside class="sidebar" id="sidebar">
    <section class="panel panel-collapsible" id="upload-panel">
      <details id="upload-details" open>
        <summary class="panel-summary"><span>1. Upload</span></summary>
      <form id="upload-form">
        <label class="field">
          <span>Files</span>
          <input type="file" id="file-input" multiple required />
        </label>
        <label class="field">
          <span>Collection (optional)</span>
          <input type="text" id="collection-input" placeholder="e.g. handbook" />
        </label>
        <button type="submit" id="upload-btn">Add to queue</button>
        <div class="progress" id="upload-progress" hidden aria-hidden="true">
          <div class="progress-bar" id="upload-bar"></div>
        </div>
        <p class="status" id="upload-status" aria-live="polite"></p>
      </form>
      </details>
    </section>

    <section class="panel" id="queue-panel" hidden>
      <h2>Upload queue</h2>
      <div class="queue-summary" id="queue-summary"></div>
      <ul id="queue-list" class="queue"></ul>
      <button type="button" id="queue-clear-btn" class="btn-secondary">Clear finished</button>
    </section>

    <section class="panel panel-collapsible" id="docs-panel">
      <details id="docs-details" open>
        <summary class="panel-summary"><span>2. Documents</span></summary>
      <p class="muted" id="docs-empty">No documents yet. Upload one to get started.</p>
      <ul id="docs-list" class="docs"></ul>
      </details>
    </section>
    </aside>

    <section class="panel chat" id="chat-panel">
      <h2>3. Ask</h2>
      <div class="chat-controls">
        <label class="field inline">
          <span>Scope</span>
          <select id="scope-select">
            <option value="">All completed documents</option>
          </select>
        </label>
        <label class="field inline checkbox">
          <input type="checkbox" id="show-sources" checked />
          <span>Show source details</span>
        </label>
        <button type="button" id="new-chat-btn" class="btn-secondary">New chat</button>
      </div>
      <div id="chat-log" class="chat-log" aria-live="polite"></div>
      <form id="chat-form" class="chat-form">
        <textarea id="question-input" rows="1" placeholder="What can I help you with?"></textarea>
        <button type="submit" id="ask-btn" class="send-btn" aria-label="Send">
          <svg class="icon-send" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M12 5l-6 6M12 5l6 6" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/>
          </svg>
        </button>
      </form>
      <p class="composer-hint">Enter to send, Shift+Enter for a new line</p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
