<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rahmqvist Assistant</title>
  <link rel="stylesheet" href="/styles.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("rag.theme.v1");
        document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
      } catch (_) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <script src="/lang.js"></script>
  <script src="/strings.js"></script>
</head>
<body data-page="chat">
  <header class="topbar">
    <div class="topbar-brand">
      <a class="brand-logo" href="/" aria-label="Rahmqvist"></a>
      <h1>Rahmqvist Assistant</h1>
      <span class="hint" data-i18n="chat.hint">How can we help? Just ask.</span>
    </div>
    <button
      type="button"
      id="theme-toggle"
      class="theme-toggle"
      role="switch"
      aria-checked="false"
      aria-label="Use light mode"
    >
      <span class="theme-toggle-track" aria-hidden="true">
        <span class="theme-toggle-thumb"></span>
      </span>
      <span class="theme-toggle-text">
        <span class="theme-label-dark" data-i18n="common.themeDark">Dark</span>
        <span class="theme-label-light" data-i18n="common.themeLight">Light</span>
      </span>
    </button>
    <span id="user-badge" class="user-badge" hidden></span>
    <button type="button" id="logout-btn" class="btn-secondary" hidden data-i18n="common.logout">Log out</button>
  </header>

  <main class="grid">
    <section class="panel chat" id="chat-panel">
      <div class="chat-controls">
        <label class="field inline" id="market-field" hidden>
          <span data-i18n="chat.answersFor">Answers for</span>
          <select id="market-select">
            <option value="" data-i18n="chat.allMarkets">All markets</option>
          </select>
        </label>
        <label class="field inline admin-only">
          <span data-i18n="chat.searchIn">Search in</span>
          <select id="scope-select">
            <option value="" data-i18n="chat.allDocuments">All documents</option>
          </select>
        </label>
        <label class="field inline checkbox admin-only">
          <input type="checkbox" id="show-sources" checked />
          <span data-i18n="chat.showSources">Show source details</span>
        </label>
        <button type="button" id="new-chat-btn" class="btn-secondary" data-i18n="chat.newChat">New chat</button>
        <div class="voice-controls" id="voice-controls" hidden>
          <button type="button" id="mic-btn" class="mic-btn" aria-label="Ask by voice">
            <svg class="icon-mic" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zM5 11a7 7 0 0 0 14 0M12 18v3"
                    fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <svg class="icon-mic-stop" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>
            </svg>
          </button>
          <select id="voice-lang" aria-label="Voice language" data-i18n-aria-label="voice.language">
            <option value="en">English</option>
            <option value="sv">Svenska</option>
            <option value="nb">Norsk</option>
            <option value="fi">Suomi</option>
            <option value="da">Dansk</option>
          </select>
          <span id="voice-status" class="voice-status" role="status" aria-live="polite"></span>
        </div>
      </div>
      <div id="chat-log" class="chat-log" aria-live="polite"></div>
      <form id="chat-form" class="chat-form">
        <div class="composer-field">
          <textarea id="question-input" rows="1" placeholder="What can I help you with?"
                    data-i18n-placeholder="chat.placeholder"
                    aria-label="Ask a question" data-i18n-aria-label="chat.inputLabel"></textarea>
          <!-- The rolling greeting app.js puts over the empty box; decoration only. -->
          <div class="composer-roll" id="composer-roll" aria-hidden="true" hidden></div>
        </div>
        <button type="submit" id="ask-btn" class="send-btn" aria-label="Send">
          <svg class="icon-send" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M12 5l-6 6M12 5l6 6" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/>
          </svg>
        </button>
      </form>
      <p class="composer-hint" data-i18n="chat.composerHint">Enter to send, Shift+Enter for a new line</p>
    </section>
  </main>

  <script src="/shell.js"></script>
  <script src="/greetings.js"></script>
  <script src="/app.js"></script>
</body>
</html>
